name: edusave
description: Application mobile offline pour la CNF - EduSave (Flutter + SQLite)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  sqflite_sqlcipher: ^2.2.1
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.1+2
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  pdf: ^3.11.0
  excel: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
